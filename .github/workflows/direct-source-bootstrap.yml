name: Direct Source Bootstrap

on:
  push:
    branches:
      - tmp/production-suite-validation-20260902
    paths:
      - experiments/direct-source-parts/**
      - .github/workflows/direct-source-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: direct-source-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify transport and materialize source
        shell: bash
        run: |
          set -euo pipefail
          cat experiments/direct-source-parts/part-* > /tmp/direct-suite.tar.xz.b64
          echo "3df2635fa94863b9188b61b71ecbde733abc4fef66d684a22278126c6881908e  /tmp/direct-suite.tar.xz.b64" | sha256sum -c -
          base64 -d /tmp/direct-suite.tar.xz.b64 > /tmp/direct-suite.tar.xz
          echo "012e426503900fd03330971c78cf95a0ac71afa069f88501a0054b51ade82357  /tmp/direct-suite.tar.xz" | sha256sum -c -
          rm -rf springboot-vue-nine-projects
          tar -xJf /tmp/direct-suite.tar.xz -C .
          test "$(find springboot-vue-nine-projects -type f | wc -l)" -eq 439
          test "$(find springboot-vue-nine-projects -name '*.java' -type f | wc -l)" -eq 267
          test "$(find springboot-vue-nine-projects -name package-lock.json -type f | wc -l)" -eq 9
          test "$(find springboot-vue-nine-projects -name Dockerfile -type f | wc -l)" -eq 9
          test "$(find springboot-vue-nine-projects -name RequestCorrelationFilter.java -type f | wc -l)" -eq 9
          test "$(find springboot-vue-nine-projects -name SecurityRegressionTests.java -type f | wc -l)" -eq 9
      - name: Commit real source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf experiments/direct-source-parts
          rm -f .github/workflows/direct-source-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: upload production suite source directly'
          git push origin HEAD:"${GITHUB_REF_NAME}"
