name: Android verification

on:
  push:
    branches:
      - main
      - feature/watermark-cleaner-android17
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 platform
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-37.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit, lint and assemble
        run: gradle --stacktrace --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-artifacts
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 build platform
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-37.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            gradle --stacktrace --console=plain :app:connectedDebugAndroidTest
            gradle --console=plain :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.github.z121z1.watermarkcleaner
            adb shell monkey -p io.github.z121z1.watermarkcleaner -c android.intent.category.LAUNCHER 1
            sleep 3
            mkdir -p app/build/verification-screenshots
            adb exec-out screencap -p > app/build/verification-screenshots/home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-verification
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/verification-screenshots/**
