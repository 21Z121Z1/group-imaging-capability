name: Android verification

on:
  push:
    branches:
      - main
      - feature/watermark-cleaner-android17
      - feature/coloros-material-playground
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 / API 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit, lint and assemble
        run: gradle --stacktrace --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify ColorOS material playground
        if: github.ref == 'refs/heads/feature/coloros-material-playground' || github.head_ref == 'feature/coloros-material-playground'
        run: gradle --stacktrace --console=plain :material-playground:testDebugUnitTest :material-playground:lintDebug :material-playground:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-artifacts
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            material-playground/build/outputs/apk/debug/*.apk
            material-playground/build/reports/tests/**
            material-playground/build/reports/lint-results-debug.*

  material-playground-build:
    if: github.ref == 'refs/heads/feature/coloros-material-playground' || github.head_ref == 'feature/coloros-material-playground'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 / API 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - id: verify
        name: Test, lint and assemble ColorOS material playground
        run: gradle --stacktrace --console=plain :material-playground:testDebugUnitTest :material-playground:lintDebug :material-playground:assembleDebug
      - name: Upload ColorOS material playground APK
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coloros-material-playground-debug-apk
          path: material-playground/build/outputs/apk/debug/*.apk
      - name: Report ColorOS material playground build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          state=failure
          description="test/lint/assemble failed"
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state=success
            description="test/lint/assemble passed"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"coloros-material-playground/build\",\"description\":\"${description}\"}"

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 / API 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          script: |
            gradle --stacktrace --console=plain :app:connectedDebugAndroidTest
            gradle --console=plain :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.github.z121z1.watermarkcleaner
            adb shell monkey -p io.github.z121z1.watermarkcleaner -c android.intent.category.LAUNCHER 1
            sleep 3
            mkdir -p app/build/verification-screenshots
            adb exec-out screencap -p > app/build/verification-screenshots/home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-verification
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/verification-screenshots/**

  material-playground-emulator:
    if: github.ref == 'refs/heads/feature/coloros-material-playground' || github.head_ref == 'feature/coloros-material-playground'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 / API 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          script: |
            gradle --stacktrace --console=plain :material-playground:assembleDebug
            adb install -r material-playground/build/outputs/apk/debug/material-playground-debug.apk
            adb shell am force-stop io.github.z121z1.colorosmaterialplayground
            adb shell monkey -p io.github.z121z1.colorosmaterialplayground -c android.intent.category.LAUNCHER 1
            sleep 4
            mkdir -p material-playground/build/verification-screenshots
            adb exec-out screencap -p > material-playground/build/verification-screenshots/catalog.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coloros-material-playground-emulator
          if-no-files-found: ignore
          path: |
            material-playground/build/verification-screenshots/**
            material-playground/build/outputs/apk/debug/*.apk
