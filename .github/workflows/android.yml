name: Android

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Publish installable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view unmark-preview >/dev/null 2>&1; then
            gh release create unmark-preview \
              --prerelease \
              --title "Unmark Preview" \
              --notes "Automated preview build. Source commit: ${GITHUB_SHA}"
          fi
          gh release upload unmark-preview \
            "app/build/outputs/apk/debug/app-debug.apk#Unmark-debug.apk" \
            --clobber

      - name: Compile instrumentation APK
        run: gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace

      - name: Assemble minified release
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unmark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
