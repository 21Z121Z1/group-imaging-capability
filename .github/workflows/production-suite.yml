name: Production Suite Validation

on:
  push:
    branches:
      - tmp/production-suite-validation-20260902
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: production-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  SUITE_ROOT: springboot-vue-nine-projects

jobs:
  source-present:
    name: Direct source present
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        shell: bash
        run: |
          if [ -d "$SUITE_ROOT/01-campus-club" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend ${{ matrix.project }}
    needs: source-present
    if: needs.source-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: 01-campus-club, port: 8101 }
          - { project: 02-snack-groupbuy, port: 8102 }
          - { project: 03-rental-platform, port: 8103 }
          - { project: 04-homework-management, port: 8104 }
          - { project: 05-lost-found, port: 8105 }
          - { project: 06-gym-membership, port: 8106 }
          - { project: 07-flower-shop, port: 8107 }
          - { project: 08-online-library, port: 8108 }
          - { project: 09-lab-reservation, port: 8109 }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: suite_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/backend/pom.xml
      - name: Full Maven verify
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/backend
        run: mvn -B -ntp verify
      - name: Build non-root runtime image
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/backend
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t "suite/${{ matrix.project }}:${{ github.sha }}" .
          test "$(docker inspect --format '{{.Config.User}}' "suite/${{ matrix.project }}:${{ github.sha }}")" = 'app'
      - name: Production MySQL / Flyway / Hibernate smoke
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/backend
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:mysql://127.0.0.1:3306/suite_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: root
          DB_PASSWORD: root-test-only
          APP_CORS_ALLOWED_ORIGINS: https://example.test
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" >"/tmp/${{ matrix.project }}.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 60); do
            if curl --silent --fail -H 'X-Request-Id: ci-smoke' "http://127.0.0.1:${{ matrix.port }}/actuator/health" | grep -q '"status":"UP"'; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat "/tmp/${{ matrix.project }}.log"
            exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${{ matrix.port }}/actuator/prometheus")" = '401'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"username":"admin","password":"Admin123!Demo"}' "http://127.0.0.1:${{ matrix.port }}/api/auth/login")" = '401'
          curl -sS -D /tmp/headers -o /dev/null -H 'X-Request-Id: ci-smoke' "http://127.0.0.1:${{ matrix.port }}/actuator/health"
          grep -qi '^X-Request-Id: ci-smoke' /tmp/headers
          kill "$pid"
          wait "$pid" || true
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ matrix.project }}
          path: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 3

  frontend:
    name: Frontend ${{ matrix.project }}
    needs: source-present
    if: needs.source-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-campus-club
          - 02-snack-groupbuy
          - 03-rental-platform
          - 04-homework-management
          - 05-lost-found
          - 06-gym-membership
          - 07-flower-shop
          - 08-online-library
          - 09-lab-reservation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify committed lockfile
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/frontend
        run: test -s package-lock.json
      - name: Reproducible clean install
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Production dependency audit
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        working-directory: ${{ env.SUITE_ROOT }}/${{ matrix.project }}/frontend
        run: npm run build

  source-policy:
    name: Production policy invariants
    needs: source-present
    if: needs.source-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Verify production source policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$SUITE_ROOT" -mindepth 1 -maxdepth 1 -type d -name '[0-9][0-9]-*' | wc -l)" -eq 9
          test "$(find "$SUITE_ROOT" -path '*/frontend/package-lock.json' -type f | wc -l)" -eq 9
          test "$(find "$SUITE_ROOT" -name RequestCorrelationFilter.java -type f | wc -l)" -eq 9
          test "$(find "$SUITE_ROOT" -name SecurityRegressionTests.java -type f | wc -l)" -eq 9
          test "$(find "$SUITE_ROOT" -name Dockerfile -type f | wc -l)" -eq 9
          ! grep -R --line-number -E 'localStorage|sessionStorage' "$SUITE_ROOT"/*/frontend/src
          ! grep -R --line-number 'findAll()' "$SUITE_ROOT"/*/backend/src/main/java --include='*Controller.java'
          ! grep -R --line-number -E '@RequestBody[[:space:]]+(Club|ClubActivity|SnackProduct|GroupCampaign|RentalListing|Course|Assignment|LostFoundPost|MembershipPlan|FlowerProduct|Book|Laboratory)[[:space:]]' "$SUITE_ROOT"/*/backend/src/main/java
          ! grep -R --line-number -E 'DB_PASSWORD:[^$]|password:[[:space:]]+(root|admin|123456)' "$SUITE_ROOT"/*/backend/src/main/resources/application.yml
          for p in "$SUITE_ROOT"/[0-9][0-9]-*; do
            test -s "$p/frontend/package-lock.json"
            grep -q 'default: prod' "$p/backend/src/main/resources/application.yml"
            grep -q 'ddl-auto: validate' "$p/backend/src/main/resources/application.yml"
            grep -q 'validate-on-migrate: true' "$p/backend/src/main/resources/application.yml"
            grep -q 'APP_CORS_ALLOWED_ORIGINS' "$p/backend/src/main/resources/application.yml"
            grep -q 'console: logstash' "$p/backend/src/main/resources/application.yml"
            grep -q '^USER app$' "$p/backend/Dockerfile"
            user_file="$(find "$p/backend/src/main/java" -path '*/auth/User.java' -print -quit)"
            auth_file="$(find "$p/backend/src/main/java" -path '*/auth/AuthService.java' -print -quit)"
            seed_file="$(find "$p/backend/src/main/java" -path '*/auth/AuthSeed.java' -print -quit)"
            sec_file="$(find "$p/backend/src/main/java" -path '*/auth/SecurityConfig.java' -print -quit)"
            handler_file="$(find "$p/backend/src/main/java" -path '*/common/GlobalExceptionHandler.java' -print -quit)"
            token_file="$(find "$p/backend/src/main/java" -path '*/auth/AuthToken.java' -print -quit)"
            request_id_file="$(find "$p/backend/src/main/java" -path '*/common/RequestCorrelationFilter.java' -print -quit)"
            test -n "$user_file" && grep -q '@JsonIgnore' "$user_file"
            test -n "$auth_file" && grep -q 'new SecureRandom' "$auth_file"
            grep -q 'password.length() < 12' "$auth_file"
            grep -q 'purgeExpiredTokens' "$auth_file"
            grep -Eq 'Profile\(\{"dev","test","ci"\}\)' "$seed_file"
            grep -q 'new BCryptPasswordEncoder(12)' "$sec_file"
            grep -q '/actuator/prometheus' "$sec_file"
            grep -q 'X-Request-Id' "$sec_file"
            grep -q 'DataIntegrityViolationException' "$handler_file"
            grep -q 'ObjectOptimisticLockingFailureException' "$handler_file"
            grep -q 'idx_auth_expires' "$token_file"
            grep -q 'X-Request-Id' "$request_id_file"
            grep -q 'idx_auth_token_expires_at' "$p/backend/src/main/resources/db/migration/V1__baseline.sql"
          done

  codeql-java:
    name: CodeQL Java
    needs: source-present
    if: needs.source-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build all Java projects under CodeQL tracing
        shell: bash
        run: |
          set -euo pipefail
          for p in "$SUITE_ROOT"/[0-9][0-9]-*/backend; do
            (cd "$p" && mvn -B -ntp -DskipTests package)
          done
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  codeql-js:
    name: CodeQL JavaScript
    needs: source-present
    if: needs.source-present.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
