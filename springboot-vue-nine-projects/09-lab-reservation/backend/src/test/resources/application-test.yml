spring:
  datasource:
    url: jdbc:h2:mem:lab_reservation;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  auth:
    token-hours: 1
  security:
    allowed-origins: http://localhost:9999
    auth-rate-limit-per-minute: 1000
