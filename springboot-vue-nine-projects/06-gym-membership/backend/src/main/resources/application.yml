server:
  port: 8106
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: gym-membership
  profiles:
    default: prod
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  auth:
    token-hours: 12
  security:
    allowed-origins: http://localhost:5106,http://127.0.0.1:5106
    auth-rate-limit-per-minute: 12
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/gym-membership;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:4}
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
app:
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: logstash
